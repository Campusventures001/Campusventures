<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Campus Venture</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4f4;font:15px Arial;color:#14213d}.card{width:min(380px,88vw);padding:34px;background:#fff;border-radius:16px;box-shadow:0 15px 45px #1232}img{display:block;width:145px;height:86px;object-fit:contain;margin:auto}h1{font-size:27px}p{color:#667085;line-height:1.5}label{display:block;font-weight:bold;margin:15px 0 6px}input,button{width:100%;box-sizing:border-box;height:47px;border-radius:8px;font:inherit}input{border:1px solid #ccd6df;padding:10px}button{margin-top:22px;border:0;background:#0f766e;color:#fff;font-weight:bold;cursor:pointer}.error{display:none;margin-top:15px;color:#b42318}.back{display:block;text-align:center;margin-top:22px;color:#0f766e;font-weight:bold;text-decoration:none}</style><main class="card"><img src="images/campus-ventures-logo.jpeg" alt="Campus Ventures"><h1>Administrator login</h1><p>Restricted to authorized administrators.</p><form id="form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Sign in as admin</button></form><div id="error" class="error"></div><a class="back" href="login.html">← User login</a></main><script>const f=document.querySelector('#form'),e=document.querySelector('#error');f.onsubmit=async x=>{x.preventDefault();e.style.display='none';let r=await fetch(location.origin+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json().catch(()=>({}));if(!r.ok){e.textContent=d.message||'Admin login failed.';e.style.display='block';return}localStorage.setItem('campus-venture-auth-v1',JSON.stringify({...d.user,role:'admin'}));localStorage.setItem('campus-venture-token-v1',d.token);location='index.html'}</script></html>
